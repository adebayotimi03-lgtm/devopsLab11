name: Bash CI

on:
  push:
    branches:
      - main
    paths:
      - '**/*.sh'
  workflow_dispatch:

jobs:
  bash-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Check Bash scripts
        run: |
          find . -type f -name "*.sh" -print0 | xargs -0 -r shellcheck -s bash
